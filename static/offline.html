<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060c18" />
  <title>Offline • Pollination System</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#060c18;color:#e2e8f0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
    .card{max-width:420px;width:100%;background:rgba(10,18,35,.9);border:1px solid rgba(0,200,255,.15);border-radius:12px;padding:18px}
    h1{margin:0 0 8px;font-size:1.1rem}
    p{margin:0 0 14px;color:#94a3b8;line-height:1.5;font-size:.92rem}
    a{display:inline-block;text-decoration:none;border:1px solid #34d399;color:#34d399;padding:8px 12px;border-radius:8px;font-weight:600}
  </style>
</head>
<body>
  <main class="card">
    <h1>You are offline</h1>
    <p>The app shell is available, but live camera feed and API data need a connection. Reconnect and reload to continue monitoring.</p>
    <a href="/">Try Again</a>
  </main>
</body>
</html>
