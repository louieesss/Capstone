<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Pollination System{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    *,html,body{box-sizing:border-box;margin:0;padding:0;}
    body{background:#080e1a;font-family:'Inter',sans-serif;color:#e2e8f0;height:100vh;display:flex;overflow:hidden;}

    /* ── Sidebar ── */
    #sidebar{
      width:220px;min-width:220px;background:#060c18;
      border-right:1px solid rgba(0,200,255,0.1);
      display:flex;flex-direction:column;z-index:10;
    }
    .nav-logo{padding:20px 16px 14px;border-bottom:1px solid rgba(0,200,255,0.08);}
    .nav-logo h1{font-size:0.85rem;font-weight:700;color:#fff;letter-spacing:0.05em;}
    .nav-logo p{font-size:0.65rem;color:rgba(0,200,255,0.5);margin-top:2px;letter-spacing:0.08em;text-transform:uppercase;}

    .nav-section{padding:14px 10px 4px;font-size:0.6rem;font-weight:600;
      color:rgba(0,200,255,0.35);letter-spacing:0.12em;text-transform:uppercase;}

    .nav-item{
      display:flex;align-items:center;gap:10px;
      padding:9px 14px;margin:2px 8px;border-radius:7px;
      text-decoration:none;color:#94a3b8;font-size:0.82rem;font-weight:500;
      transition:all 0.15s;cursor:pointer;
    }
    .nav-item:hover{background:rgba(0,200,255,0.08);color:#e2e8f0;}
    .nav-item.active{background:rgba(0,200,255,0.12);color:#7dd3fc;
      border-left:2px solid #38bdf8;}
    .nav-item .icon{width:18px;text-align:center;font-size:1rem;flex-shrink:0;}

    .nav-footer{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(0,200,255,0.08);}
    #status-dot{width:8px;height:8px;border-radius:50%;background:#34d399;
      box-shadow:0 0 0 0 #34d39966;animation:pulse 1.5s infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 #34d39966}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
    #status-dot.offline{background:#f87171;animation:none;}

    /* ── Main content ── */
    #main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    #topbar{
      height:48px;min-height:48px;background:#060c18;
      border-bottom:1px solid rgba(0,200,255,0.08);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
    }
    #topbar .page-title{font-size:0.9rem;font-weight:600;color:#e2e8f0;}
    #topbar .meta{font-size:0.72rem;color:#64748b;font-family:'JetBrains Mono',monospace;}
    #content{flex:1;overflow:auto;padding:16px;}

    /* ── Panels ── */
    .panel{
      background:rgba(10,18,35,0.9);
      border:1px solid rgba(0,200,255,0.1);
      border-radius:10px;overflow:hidden;
    }
    .panel::before{content:'';display:block;height:1px;
      background:linear-gradient(90deg,transparent,rgba(0,200,255,0.3),transparent);}
    .panel-head{
      padding:10px 14px 0;font-size:0.62rem;font-weight:600;
      color:rgba(0,200,255,0.55);text-transform:uppercase;letter-spacing:0.1em;
    }

    /* ── Color classes ── */
    .c-green{color:#34d399;} .c-blue{color:#60a5fa;} .c-red{color:#f87171;}
    .c-gray{color:#64748b;}

    /* Scrollbar */
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.2);border-radius:4px;}

    /* Lightbox */
    #lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;
      display:none;align-items:center;justify-content:center;}
    #lightbox.show{display:flex;}
    #lightbox img{max-width:90vw;max-height:85vh;border-radius:10px;}
  </style>
</head>
<body>

<!-- ── SIDEBAR ──────────────────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="nav-logo">
    <h1>🌸 Pollination</h1>
    <p>Monitoring System</p>
  </div>

  <div class="nav-section">Navigation</div>

  <a href="/" class="nav-item {% if active=='dashboard' %}active{% endif %}">
    <span class="icon">📊</span> Dashboard
  </a>
  <a href="/report" class="nav-item {% if active=='report' %}active{% endif %}">
    <span class="icon">📋</span> Report
  </a>
  <a href="/control" class="nav-item {% if active=='control' %}active{% endif %}">
    <span class="icon">⚙️</span> Control
  </a>

  <div class="nav-section" style="margin-top:8px;">Classes</div>
  <div class="nav-item" style="cursor:default;">
    <span style="width:8px;height:8px;border-radius:50%;background:#34d399;flex-shrink:0;"></span>
    <span style="font-size:0.75rem;color:#94a3b8;">Pollinating</span>
  </div>
  <div class="nav-item" style="cursor:default;">
    <span style="width:8px;height:8px;border-radius:50%;background:#60a5fa;flex-shrink:0;"></span>
    <span style="font-size:0.75rem;color:#94a3b8;">Pollinated</span>
  </div>
  <div class="nav-item" style="cursor:default;">
    <span style="width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0;"></span>
    <span style="font-size:0.75rem;color:#94a3b8;">Not Pollinated</span>
  </div>

  <div class="nav-footer">
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="status-dot"></div>
      <span id="status-text" style="font-size:0.72rem;color:#64748b;">Connecting…</span>
    </div>
    <div id="clock" style="font-size:0.68rem;color:#334155;margin-top:4px;font-family:'JetBrains Mono',monospace;"></div>
  </div>
</nav>

<!-- ── MAIN ─────────────────────────────────────────────────────────── -->
<div id="main">
  <div id="topbar">
    <span class="page-title">{% block page_title %}{% endblock %}</span>
    <span class="meta" id="topbar-meta">EfficientNet-B3 · 82.6% val accuracy</span>
  </div>
  <div id="content">
    {% block content %}{% endblock %}
  </div>
</div>

<!-- ── LIGHTBOX ─────────────────────────────────────────────── -->
<div id="lightbox" onclick="closeLB()">
  <img id="lb-img" src=""/>
</div>

<script>
// Clock
function tick(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString();
}
tick(); setInterval(tick,1000);

// Status dot
async function pingStatus(){
  try{
    const r=await fetch('/api/status');
    const d=await r.json();
    const dot=document.getElementById('status-dot');
    const txt=document.getElementById('status-text');
    if(d.cam_running){
      dot.className=''; dot.style.cssText='width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 #34d39966;animation:pulse 1.5s infinite;';
      txt.textContent='Camera Live';txt.style.color='#34d399';
    } else {
      dot.className='offline'; dot.style.cssText='width:8px;height:8px;border-radius:50%;background:#f87171;';
      txt.textContent='Camera Off';txt.style.color='#f87171';
    }
    if(window._onStatus) window._onStatus(d);
  }catch(e){
    document.getElementById('status-text').textContent='Offline';
  }
}
pingStatus(); setInterval(pingStatus,2000);

function openLB(src){
  document.getElementById('lb-img').src=src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLB(){document.getElementById('lightbox').classList.remove('show');}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
